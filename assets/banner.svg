<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 0.7; transform: scale(1.02); }
        100% { opacity: 0.3; transform: scale(0.98); }
      }
      @keyframes floatBeam {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      .animated-bg {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-icon {
        animation: floatBeam 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Geometric Accents -->
  <circle cx="150" cy="150" r="180" fill="#38bdf8" opacity="0.08" class="animated-bg" />
  <circle cx="1050" cy="150" r="220" fill="#c084fc" opacity="0.08" class="animated-bg" />

  <!-- Grid Overlay Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="300" fill="url(#grid)" />
  </g>

  <!-- Decorative Pillar / Legislative Columns Graphic -->
  <g transform="translate(80, 75)" class="floating-icon" opacity="0.85">
    <!-- Capital dome & columns icon -->
    <path d="M 60 10 L 10 40 L 110 40 Z" fill="url(#textGrad)" />
    <rect x="20" y="48" width="12" height="70" rx="3" fill="#38bdf8" />
    <rect x="44" y="48" width="12" height="70" rx="3" fill="#6366f1" />
    <rect x="64" y="48" width="12" height="70" rx="3" fill="#818cf8" />
    <rect x="88" y="48" width="12" height="70" rx="3" fill="#c084fc" />
    <rect x="10" y="124" width="100" height="12" rx="3" fill="url(#textGrad)" />
  </g>

  <!-- Title & Subtitle -->
  <g text-anchor="middle">
    <text x="630" y="115" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="44" fill="url(#textGrad)" filter="url(#glow)" letter-spacing="1">
      AWESOME LEGISLATIVE MANAGEMENT
    </text>
    <text x="630" y="165" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="20" fill="#94a3b8" letter-spacing="0.5">
      SaaS Platforms • Open-Source Tools • Agenda &amp; Meeting Governance
    </text>

    <!-- Decorative Divider Badge -->
    <rect x="440" y="195" width="380" height="32" rx="16" fill="url(#accentGlow)" opacity="0.2" />
    <text x="630" y="216" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#e2e8f0" letter-spacing="2">
      CIVIC TECH &amp; MUNICIPAL ECOSYSTEM
    </text>
  </g>
</svg>
